name: Bootstrap owned Convex

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - .github/workflows/convex-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: convex-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure owner identity and authentication keys
        run: npm run convex:bootstrap-owned
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
