name: Deploy Grok handoff MCP to Convex once
on:
  push:
    branches: [work]
    paths: [.github/workflows/deploy-convex-once.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - name: Configure agent handoff secret
        run: npx convex env set AGENT_HANDOFF_SECRET "$AGENT_HANDOFF_SECRET"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          AGENT_HANDOFF_SECRET: ${{ secrets.AGENT_HANDOFF_SECRET }}
      - run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
