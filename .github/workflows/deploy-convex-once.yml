name: Deploy Convex production once

on:
  push:
    branches: [work]
    paths: [.github/workflows/deploy-convex-once.yml]

permissions:
  contents: read

concurrency:
  group: wof-convex-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build
      - name: Deploy Convex production
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
