services:
  nora-garmin-bridge:
    build: .
    restart: unless-stopped
    env_file:
      - .env.garmin
    environment:
      GARMIN_DAILY_WEBHOOK_URL: "REPLACE_WITH_N8N_WEBHOOK_URL"
      GARMIN_TOKEN_STORE: /tokens
    volumes:
      - garmin_tokens:/tokens
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64

volumes:
  garmin_tokens:
